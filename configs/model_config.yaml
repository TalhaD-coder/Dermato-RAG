# ============================================
# Model Konfigürasyonu
# ============================================
# Vision encoder, text encoder, LLM ve RAG
# modelleri için ayarlar.
# ============================================

# ---- Vision Encoder ----
vision:
  model_name: "microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"
  image_size: 224
  batch_size: 32
  num_workers: 4
  pretrained: true

# ---- Text Encoder / Embedding ----
embedding:
  model_name: "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
  max_length: 512
  batch_size: 64
  normalize: true

# ---- LLM ----
llm:
  # Kullanılacak LLM sağlayıcısı: "openai", "gemini", "local"
  provider: "openai"
  
  openai:
    model: "gpt-4o"
    temperature: 0.1
    max_tokens: 2048
    top_p: 0.95
  
  gemini:
    model: "gemini-pro"
    temperature: 0.1
    max_tokens: 2048
  
  local:
    model_path: null
    quantization: "4bit"         # "4bit", "8bit", "none"

# ---- RAG Pipeline ----
rag:
  # Chunking
  chunk_size: 512
  chunk_overlap: 50
  chunking_strategy: "semantic"   # "fixed", "semantic", "recursive"
  
  # Retrieval
  retrieval_strategy: "hybrid"    # "dense", "sparse", "hybrid"
  top_k: 10                      # İlk retrieval sayısı
  rerank_top_k: 5                # Re-ranking sonrası döndürülecek sayı
  
  # Vector DB
  vector_db: "chromadb"           # "chromadb" veya "faiss"
  collection_name: "dermato_knowledge"
  similarity_metric: "cosine"     # "cosine", "l2", "ip"
  
  # Hybrid Search Weights
  dense_weight: 0.7
  sparse_weight: 0.3

# ---- Re-Ranker ----
reranker:
  model_name: "cross-encoder/ms-marco-MiniLM-L-12-v2"
  batch_size: 16
